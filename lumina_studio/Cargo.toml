[workspace]
members = [
    "lumina_core",
    "lumina_timeline",
    "lumina_color",
    "lumina_compositor",
    "lumina_app"
]
resolver = "2"

[workspace.dependencies]
uuid = { version = "1.7.0", features = ["v4"] }
wgpu = "0.19"
slint = "1.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = 'abort'
strip = true
